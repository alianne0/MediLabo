server:
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          "[/**]":
            allowed-origins:
              - http://localhost:3000
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers:
              - Authorization
              - Content-Type
              - X-Requested-With
            exposed-headers:
              - Authorization
            allow-credentials: true

      routes:
        - id: notes-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/notes/**

        - id: demographics
          uri: http://localhost:8081
          predicates:
            - Path=/api/**

