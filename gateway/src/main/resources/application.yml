server:
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: notes-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/notes/**
                - Method=GET,POST,PUT,DELETE,OPTIONS

            - id: risk-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/risk/**
                - Method=GET,OPTIONS

            - id: demographics
              uri: http://localhost:8081
              predicates:
                - Path=/api/**
                - Method=GET,POST,PUT,DELETE,OPTIONS

